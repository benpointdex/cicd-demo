name: Docker Build -> Push -> Deploy

on:
  push:
    branches: [ "main" ]
  
jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:
    
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
    - uses: actions/setup-java@v5
      with:
            distribution: 'temurin' # See 'Supported distributions' for available options
            java-version: '21'

    - name : Build Jar
      run : ./mvnw clean package -DskipTests

    - name : Login To Docker Hub
      run: docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin'

    - name : Build Docker Images
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}//cicd:latest

    - name : Push Image To Docker Hub
     run: docker push ${{ secrets.DOCKER_USERNAME }}/cicd:latest

    - name : SSH and Deploy to EC2
      uses: appleboy/ssh-action@v1
      with:
       host: "foo.com"
       host: ${{ secrets.EC2_HOST }}
       username: ${{ secrets.EC2_USER }}
       key: ${{ secrets.EC2_SSH_KEY }}
       script: |
        docker stop spring-demo || true 
        delete rm spring-demo || true
        docker pull ${{ secrets.DOCKER_USERNAME }}/cicd:latest
        docker run -d -name spring-demo -p 8080:8080 ${{secrets.DOCKER_USERNAME }}/cicd:latest
    
